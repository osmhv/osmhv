<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم اختراق الموقع</title>
    <style>
        body {
            background-color: black;
            color: red;
            text-align: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: 50px;
            text-shadow: 0 0 20px red;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        p {
            font-size: 20px;
            margin-top: 20px;
        }

        .glitch {
            font-size: 30px;
            font-weight: bold;
            position: relative;
            display: inline-block;
            animation: glitch 0.5s infinite alternate;
        }

        @keyframes glitch {
            0% { transform: translateX(0); }
            20% { transform: translateX(-3px); }
            40% { transform: translateX(3px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        .hacker-console {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100px;
            background: black;
            color: green;
            font-family: monospace;
            padding: 10px;
            border: 2px solid green;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>🔥 تم اختراق هذا الموقع 🔥</h1>
    <p class="glitch">الهكر: المجهول</p>
    <div class="hacker-console">
        <p>> Access Granted...</p>
        <p>> Injecting Malicious Code...</p>
        <p>> System Compromised!</p>
    </div>
</body>
</html>
